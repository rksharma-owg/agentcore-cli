name: Fork preflight

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact contribution commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Configure git for tests
        run: |
          git config --global user.email \"ci@amazon.com\"
          git config --global user.name \"CI\"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run secrets:check
      - run: npm run security:audit
